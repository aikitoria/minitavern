services:
  minitavern:
    build: .
    container_name: minitavern
    user: "1000:1000"
    ports:
      - "5487:5487"
    volumes:
      - ./data:/data
      - ./certs:/certs:ro
    environment:
      TLS_CERT_PATH: /certs/cert.pem
      TLS_KEY_PATH: /certs/key.pem
      MINITAVERN_IP_ALLOWLIST: ""
    restart: unless-stopped
    # Also joined to ComfyUI's network so the server can reach http://comfy:8588.
    networks:
      - default
      - comfy

networks:
  comfy:
    external: true
    name: my-bridge-network
